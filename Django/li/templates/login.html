            <div class="login-box">
                <div class="owl" id="owl">
                    <div class="hand"></div>
                    <div class="hand hand-r"></div>
                    <div class="arms">
                        <div class="arm"></div>
                        <div class="arm arm-r"></div>
                    </div>
                </div>
                <form id="fo" method="post" class="form-signin">
                    {% csrf_token %}
                    <div class="input-box">
                        <input name="user" id="user" type="text" placeholder="Username">
                        <p id="warning_name"></p>
                        <input name="pwd" id="password" type="password" placeholder="Password">
                        <p id="warning_pwd"></p>
                    </div>
                </form>

                <a href="#" class="auth-link text-black">Forgot password?</a>
                <button form="fo" id="login" type="submit" class="btn btn-primary btn-lg" data-toggle="modal"
                    data-target="#myModal" style="margin-bottom:15px;width: 100%;background-color: rgb(32,178,170);">
                    <font size="3px" style="align-content:center;">SIGN IN</font>
                </button>

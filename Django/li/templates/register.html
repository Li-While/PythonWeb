{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

    <title>猫头鹰register界面</title>
    <link rel="stylesheet" href="{% static 'css/mao.css' %}">
    <script src="{% static 'js/jquery-3.6.0.min.js' %}"></script>
    <script src="{% static 'js/echarts.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/code.css' %}">
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/3.3.7/css/bootstrap.min.css">
    <script src="https://cdn.staticfile.org/twitter-bootstrap/3.3.7/js/bootstrap.min.js"></script>
</head>

<body
    style="margin:0;padding:0;background: linear-gradient(200deg, #72afd3, #96fbc4);display: flex;justify-content: center;align-items: center;height: 100vh;">
    <div style="width:400px;height:550px;background-color:rgb(131,205,195);margin:auto;border-radius: 3%;">
        <div style="padding: 10px 30px;height: 100%;margin:10px 0 0 10px;">
            <div class="brand-logo" style="width: 100%;height: 40px;margin-bottom:20px;position: relative;right: 30px">
                <a class=" navbar-brand brand-logo" href=""><img src="{% static 'img/LiWhalelogo.png' %}" alt="logo"
                        style="width: 40px;height:40px;border-radius: 50%;display: inline-block;">
                    <font style="font-size: 25px;font-weight:bold;color: rgb(17, 90, 119);display: inline-block">
                        Li-Whale
                    </font>
                </a>
            </div>
            <form class="pt-3" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <input name="user" type="text" class="form-control form-control-lg" id="exampleInputUsername1"
                        placeholder="Username">
                </div>
                <div class="form-group">
                    <input name="pwd" type="password" class="form-control form-control-lg" id="exampleInputPassword1"
                        placeholder="Password">
                </div>
                <div class="form-group">
                    <input name="email" type="email" class="form-control form-control-lg" id="exampleInputEmail1"
                        placeholder="Email">
                </div>
                <div class="form-group">
                    <input name="age" type="text" class="form-control form-control-lg" id="exampleInputEmail1"
                        placeholder="age">
                </div>
                <div class="form-group">
                    <input name="sex" type="text" class="form-control form-control-lg" id="exampleInputEmail1"
                        placeholder="sex">
                </div>
                <div class="mb-4">
                    <div class="form-check" style="margin-bottom:15px;">
                        <label class="form-check-label text-muted">
                            <input type="checkbox" class="form-check-input">
                            I agree to all Terms & Conditions
                        </label>
                    </div>
                </div>
                <div class="mt-3" style="margin-bottom:15px;">
                    <!-- <a class="btn btn-block btn-primary btn-lg font-weight-medium auth-form-btn" 
                        href="http://127.0.0.1:8080/index">SIGN UP</a> -->
                    <input type="submit" value="SIGN UP"
                        class="btn btn-block btn-primary btn-lg font-weight-medium auth-form-btn">
                    <!-- <button type="reset" style="width: 70px;height: 30px;font-size: 15px;color:#72afd3">重置</button> -->
                </div>
                <div class="text-center mt-4 font-weight-light">
                    Already have an account? <a href="http://127.0.0.1:8080/login" class="text-primary">Login</a>
                </div>
                <div id="chart0" style="width: 400px;height:100px;"></div>
                <script src="{% static 'js/chart0.js' %}" type="text/javascript"></script>
            </form>
        </div>
    </div>
</body>

</html>
